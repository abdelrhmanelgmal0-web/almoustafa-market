<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المصطفي ماركت</title>

    <link rel="icon" type="image/png" href="sky.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1>المصطفي ماركت</h1>

        <input
            type="text"
            id="username"
            placeholder="اسم المستخدم"
        >

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
        >

        <button onclick="login()">
            تسجيل الدخول
        </button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
